dataset:
  train:
    class: DynamicCIFDataset
    cif_dir: /home/fit/liulei/WORK/CPSea2.0_PDB/Clusters_PDB70
    cif_list: /home/fit/liulei/WORK/CPSea2.0_PDB/train_all_members.txt
    cluster: /home/fit/liulei/WORK/CPSea2.0_PDB/reformatted_cluster_info.tsv
    ligand_ids_tsv: /home/fit/liulei/WORK/CPSea2.0_PDB/ligand_ids.tsv
    use_precomputed_distances: true
    precomputed_distances_dir: /home/fit/liulei/WORK/CPSea2.0_PDB/Clusters_PDB70_Distances
    pocket_th_min: 10.0
    pocket_th_max: 20.0
  valid:
    class: DynamicCIFDataset
    cif_dir: /home/fit/liulei/WORK/CPSea2.0_PDB/Clusters_PDB70
    cif_list: /home/fit/liulei/WORK/CPSea2.0_PDB/valid_selected_members.txt
    ligand_ids_tsv: /home/fit/liulei/WORK/CPSea2.0_PDB/ligand_ids.tsv
    use_precomputed_distances: true
    precomputed_distances_dir: /home/fit/liulei/WORK/CPSea2.0_PDB/Clusters_PDB70_Distances

dataloader:
  train:
    batch_size: 24
    shuffle: true
    num_workers: 16
  valid:
    batch_size: 24
    num_workers: 8

trainer:
  class: LDMTrainer
  criterion: loss
  config:
    max_epoch: 500
    save_topk: 10
    val_freq: 1
    save_dir: ./ckpts/pepany
    patience: 5
    metric_min_better: true
    proj_name: PepAny # for wandb
    logger: tensorboard # if you want to use wandb, please comment this line 

    optimizer:
      class: AdamW
      lr: 1.0e-4

    scheduler:
      class: ReduceLROnPlateau
      factor: 0.8
      patience: 5
      mode: min
      frequency: val_epoch
      min_lr: 5.0e-6

model:
  class: LDMMolDesign
  cfg_dropout_ratio: 0.2
  guidance_scale: 1.5
  autoencoder_ckpt: '' # load by yourself
  latent_deterministic: true  # without resample in training
  hidden_size: 512
  num_steps: 100
  h_loss_weight: 1.0
  std: 10.0
  diffusion_opt:
    trans_seq_type: Diffusion
    trans_pos_type: Diffusion
    encoder_type: EPT
    encoder_opt:
      n_layers: 6
      n_rbf: 64
      cutoff: 3.0  # already normalized
      n_head: 8
      use_edge_feat: true
      pre_norm: true
      efficient: false
      vector_act: layernorm
  is_aa_corrupt_ratio: 0.1

load_ckpt: ''
