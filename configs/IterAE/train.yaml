dataset:
  train:
    class: DynamicCIFDataset
    cif_dir: ./datasets/CPSea2.0_PDB/Clusters_PDB70
    cif_list: ./datasets/CPSea2.0_PDB/train_all_members.txt
    cluster: ./datasets/CPSea2.0_PDB/reformatted_cluster_info.tsv
    ligand_ids_tsv: ./datasets/CPSea2.0_PDB/ligand_ids.tsv
    use_precomputed_distances: true
    precomputed_distances_dir: ./datasets/CPSea2.0_PDB/Clusters_PDB70_Distances
    pocket_th_min: 10.0
    pocket_th_max: 20.0
  valid:
    class: DynamicCIFDataset
    cif_dir: ./datasets/CPSea2.0_PDB/Clusters_PDB70
    cif_list: ./datasets/CPSea2.0_PDB/valid_selected_members.txt
    ligand_ids_tsv: ./datasets/CPSea2.0_PDB/ligand_ids.tsv
    use_precomputed_distances: true
    precomputed_distances_dir: ./datasets/CPSea2.0_PDB/Clusters_PDB70_Distances

dataloader:
  train:
    batch_size: 48
    shuffle: true
    num_workers: 8
  valid:
    batch_size: 4
    num_workers: 4

trainer:
  class: IterAETrainer
  criterion: loss
  config:
    max_epoch: 60
    save_topk: 10
    val_freq: 1
    save_dir: ./ckpts/pepany
    grad_clip: 1.0
    patience: 5
    warmup: 2000 # gradually increasing KL divergence for training stability (8 A800 GPUs)
    metric_min_better: true
    proj_name: PepAny # for wandb
    logger: tensorboard # if you want to use wandb, please comment this line

    optimizer:
      class: AdamW
      lr: 1.0e-4

    scheduler:
      class: ReduceLROnPlateau
      factor: 0.8
      patience: 5
      mode: min
      frequency: val_epoch
      min_lr: 5.0e-6

model:
  class: CondIterAutoEncoder
  cfg_dropout_ratio: 0.2
  guidance_scale: 1.5
  encoder_type: EPT
  decoder_type: EPT
  embed_size: 512
  hidden_size: 512
  latent_size: 8
  edge_size: 64
  k_neighbors: 9
  encoder_opt:
    n_rbf: 64
    cutoff: 10.0
    n_layers: 6
    n_head: 8
    use_edge_feat: true
    pre_norm: true
    efficient: false
    vector_act: layernorm
  decoder_opt:
    n_rbf: 64
    cutoff: 10.0
    n_layers: 6
    n_head: 8
    use_edge_feat: true
    pre_norm: true
    efficient: false
    vector_act: layernorm
  loss_weights:
    Zh_kl_loss: 0.6
    Zx_kl_loss: 0.8
    atom_coord_loss: 1.0
    block_type_loss: 1.0
    contrastive_loss: 0.0
    local_distance_loss: 0.5
    bond_loss: 0.5
    bond_length_loss: 0.0
  prior_coord_std: 1.0
  coord_noise_scale: 1.0
  pocket_mask_ratio: 0.05
  decode_mask_ratio: 0.0
  kl_on_pocket: false
  discrete_timestep: false

load_ckpt: ''
